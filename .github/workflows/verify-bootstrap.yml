name: HEYAT Manual Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'HEYAT commit SHA or branch to verify'
        required: true
        type: string
        default: a430df8aab7bb372366de9c977dcb550645a7f8f

permissions:
  contents: read

concurrency:
  group: heyat-manual-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify selected HEYAT revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heyat-manual-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
