name: HEYAT CI

on:
  pull_request:
  push:
    # Keep the bootstrap branch independently checkable before its first merge.
    branches: [main, chore/heyat-bootstrap]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heyat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: HYA-001 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Temporary formatter diff for review
        run: |
          npx prettier src/render/createHotelRenderer.ts src/render/people.ts src/render/skyline.ts --write
          git diff -- src/render/createHotelRenderer.ts src/render/people.ts src/render/skyline.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # - run: npm run test:e2e # restored after formatter review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heyat-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
