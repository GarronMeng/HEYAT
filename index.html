<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1c2b" />
    <meta
      name="description"
      content="HEYAT HOTEL 工程启动页 · 短流程主动增量酒店经营游戏"
    />
    <title>HEYAT HOTEL · 工程启动页</title>
    <style>
      html {
        color: #f2e6d2;
        background: #0c1c2b;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      [hidden] {
        display: none !important;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        cursor: pointer;
      }
    </style>
    <script src="./boot.js" vite-ignore></script>
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <a class="brand" href="./" aria-label="HEYAT HOTEL 首页"
          >HEYAT<span>HOTEL</span></a
        >
        <span class="build-tag">开发版本 · HYA-001</span>
      </header>
      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">一座酒店的起点</p>
          <h1 id="page-title">夜幕降临，<br />故事即将开始。</h1>
          <p class="intro-copy">
            从第一位客人，到一座自动运转的酒店。<br />HEYAT 的旅程，从这里开始。
          </p>
        </section>
        <div id="viewport" class="viewport">
          <canvas id="scene" aria-label="实时 WebGL 2 工程标记" hidden></canvas>
          <p class="scene-caption">工程渲染标记 / 酒店场景将在下一阶段搭建</p>
        </div>
        <section
          class="status-card"
          aria-labelledby="boot-status"
          aria-live="polite"
          aria-busy="true"
        >
          <span class="status-dot" aria-hidden="true"></span>
          <p class="eyebrow">启动状态</p>
          <h2 id="boot-status">正在加载页面…</h2>
          <p id="boot-detail">正在准备本地渲染模块，请稍候。</p>
          <button id="retry" type="button" hidden>重新加载</button>
          <noscript>请启用 JavaScript 后重新加载，以运行 3D 页面。</noscript>
        </section>
      </main>
      <footer>
        <span>工程基础页 · 经营系统尚未启用</span>
        <span>移动端性能尚未验收 <code>MOBILE_PERF_UNVERIFIED</code></span>
      </footer>
    </div>
    <script id="entry" type="module" src="/src/main.ts"></script>
  </body>
</html>
